aid: immunebridge
name: ImmuneBridge
description: 'ImmuneBridge is a San Francisco biotech company building a first-in-class integrated
  screening and manufacturing platform for allogeneic cell therapies. The company screens and expands
  stem cells from multiple sources (umbilical cord blood, mobilized blood, bone marrow), uses high-throughput
  automated assays with machine-learning models to predict donor and process performance early, and scales
  production with IBR403, a small molecule enabling up to 100,000-fold expansion of hematopoietic stem cells.
  The stated goal is to manufacture tens of thousands of affordable, high-quality immune cell doses (HSCs,
  NK cells, T cells, and more) from a single cord blood unit. ImmuneBridge is backed by Insight Partners,
  NFX Bio, M Ventures, and other institutional investors. This profile was enriched by the API Evangelist
  pipeline; the company publishes no public API or developer surface.'
